<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sameer TV Launcher</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <img id="wallpaper" alt="">
  <div id="scrim"></div>
  <header id="topbar">
    <div class="clockbox">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <div class="top-actions">
      <button class="top-btn focusable" data-view="allapps" type="button" title="All apps">&#x25A6;</button>
      <button class="top-btn focusable" data-view="settings" type="button" title="Settings">&#x2699;</button>
    </div>
  </header>
  <main id="main">
    <section id="view-apps" class="view active" aria-label="Home">
      <div id="home-list" class="homelist"></div>
      <div id="home-dock" class="dock"></div>
      <div id="arrange-bar" class="arrangebar"></div>
    </section>
    <section id="view-livetv" class="view" aria-label="Live TV">
      <h1 class="view-title">Live TV</h1>
      <div id="channel-grid" class="channels"></div>
      <button id="open-livetv" class="btn focusable" type="button">Open Samsung Live TV</button>
      <p id="tv-status" class="tvstatus"></p>
    </section>
    <section id="view-allapps" class="view" aria-label="All apps">
      <div class="plate">
        <h1 class="view-title">All apps</h1>
        <div class="setrow">
          <button id="arrange-home" class="btn focusable" type="button">Arrange Home</button>
        </div>
        <div id="appstore-list" class="appstore"></div>
      </div>
    </section>
    <section id="view-appearance" class="view" aria-label="Appearance">
      <div class="plate ap-plate">
        <h1 class="view-title">Appearance</h1>
        <div class="ap-flex">
          <div id="ap-preview" class="pv"></div>
          <div id="ap-rows">
            <button class="opt-row focusable" data-pref="background" type="button"><span class="opt-label">Background</span><span class="opt-val" id="optv-background"></span></button>
            <button class="opt-row focusable" data-pref="layout" type="button"><span class="opt-label">Layout</span><span class="opt-val" id="optv-layout"></span></button>
            <button class="opt-row focusable" data-pref="appsDisplay" type="button"><span class="opt-label">App display</span><span class="opt-val" id="optv-appsDisplay"></span></button>
            <button class="opt-row focusable" data-pref="focusStyle" type="button"><span class="opt-label">Focus style</span><span class="opt-val" id="optv-focusStyle"></span></button>
            <button class="opt-row focusable" data-pref="material" type="button"><span class="opt-label">Glass material</span><span class="opt-val" id="optv-material"></span></button>
            <button class="opt-row focusable" data-pref="font" type="button"><span class="opt-label">Font</span><span class="opt-val" id="optv-font"></span></button>
            <button class="opt-row focusable" data-pref="controls" type="button"><span class="opt-label">Home controls</span><span class="opt-val" id="optv-controls"></span></button>
          </div>
        </div>
        <h2 class="section-title">Wallpaper</h2>
        <div id="wp-picker" class="wp-picker"></div>
      </div>
    </section>
    <section id="view-settings" class="view" aria-label="Settings">
      <div class="plate">
        <h1 class="view-title">Settings</h1>
        <div class="setrow">
          <button id="open-appearance" class="btn focusable" type="button">&#x1F3A8; Appearance</button>
        </div>
        <div class="setrow">
          <button id="open-settings" class="btn focusable" type="button">&#x2699; TV Settings</button>
        </div>
        <div class="setrow">
          <button id="open-apps-store" class="btn focusable" type="button">&#x1F6D2; Samsung Apps</button>
        </div>
        <p id="set-status" class="tvstatus"></p>
        <h2 class="section-title">About</h2>
        <p id="tv-info" class="infoline"></p>
        <h2 class="section-title">Inputs</h2>
        <div id="inputs-row" class="inputs"></div>
        <h2 class="section-title">Sound</h2>
        <div class="setrow">
          <button id="vol-down" class="btn focusable" type="button">Volume &minus;</button>
          <span id="vol-level" class="vollevel">&mdash;</span>
          <button id="vol-up" class="btn focusable" type="button">Volume +</button>
          <button id="vol-mute" class="btn focusable" type="button">Mute</button>
        </div>
      </div>
    </section>
  </main>
  <div id="toast" role="status"></div>
</div>
<script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
<script src="js/app.js"></script>
</body>
</html>
