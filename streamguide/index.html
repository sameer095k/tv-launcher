<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<title>Stream Guide</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --font:'Manrope', "Segoe UI", Roboto, Arial, sans-serif;
    --bg:#0b0e14; --badge-ink:#16181d; --text:#f2f4f8; --white:#fff; --black:#000; --ink:#eef3fc; --ink-2:#aebdd4; --ink-3:#9fb0c9;
    --ink-4:#dbe4f2; --ink-5:#cfe0f5; --ink-6:#e8edf5; --ink-7:#eef2f9; --ink-8:#dfe8fa; --ink-9:#c9d6ea;
    --ink-10:#dfe7f3; --ink-11:#a7b8d0; --ink-12:#e8eefb; --ink-13:#cfd8dc; --ink-14:#c6d2e6; --ink-15:#dde6f2;
    --ink-16:#a9bcd8; --ink-17:#e6edf7; --ink-50:rgba(238,243,252,.5); --dim:#8fa2bd; --dim-2:#7787a3; --dim-3:#5f7292;
    --gold:#ffd34d; --gold-08:rgba(255,211,77,.08); --gold-20:rgba(255,211,77,.20); --gold-25:rgba(255,211,77,.25); --gold-65:rgba(255,211,77,.65);
    --live:#ff6b6b; --card:#101827; --panel:#1a2233; --panel-2:#10151f; --panel-3:#151c2b;
    --line:rgba(255,255,255,.09); --w07:rgba(255,255,255,.07); --w08:rgba(255,255,255,.08); --w10:rgba(255,255,255,.10);
    --w15:rgba(255,255,255,.15); --w16:rgba(255,255,255,.16); --w20:rgba(255,255,255,.20);
    --scrim-93:rgba(6,8,13,.93); --scrim-45:rgba(6,8,13,.45); --scrim-18:rgba(6,8,13,.18); --scrim-88:rgba(6,8,13,.88); --scrim-96:rgba(6,8,13,.96);
    --pill-88:rgba(8,12,22,.88); --shade-82:rgba(5,8,14,.82); --clear:rgba(0,0,0,0); --k55:rgba(0,0,0,.55); --k65:rgba(0,0,0,.65); --k88:rgba(0,0,0,.88);
    --skel-1:#131926; --skel-2:#1d2739; --skel-3:#161d2c; --skel-4:#232f47;
    --rz-bg:#2a0d18; --rz-line:rgba(255,95,87,.28); --rz-edge:#c8102e; --rz-red:#ff5f57;
    --nfx:#b00610; --dnp:#1f3fbf; --amp:#e47911; --accent-warm:#ff9d7a; --seen-88:rgba(20,120,60,.88); }
  html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
  @font-face { font-family:'Manrope'; src:url('fonts/manrope.woff2') format('woff2'); font-weight:200 800; }
  body { font-family:var(--font); color:var(--text); }
  #bg { position:absolute; left:0; top:0; width:1920px; height:1080px;
        background: var(--bg); }
  /* ---------- header ---------- */
  #hdr { position:absolute; left:0; top:0; width:1920px; height:150px; z-index:5; }
  #greet { position:absolute; left:72px; top:34px; font-size:44px; font-weight:600; }
  #subline { position:absolute; left:74px; top:96px; font-size:24px; color:var(--ink-3); }
  #clockbox { position:absolute; right:72px; top:30px; text-align:right; }
  #clock { font-size:44px; font-weight:600; }
  #wx { font-size:25px; color:var(--ink-5); margin-top:6px; }
  /* ---------- trakt ---------- */
  .ttext { margin:0 72px; font-size:30px; line-height:1.5; color:var(--ink-13); max-width:1450px; }
  .bigcode { margin:12px 72px; font-size:96px; font-weight:800; letter-spacing:14px; color:var(--white); }
  /* ---------- tabs ---------- */
  #tabs { position:absolute; left:72px; top:168px; height:64px; z-index:5; }
  .tab { display:inline-block; padding:12px 30px; margin-right:16px; border-radius:32px;
         background:var(--w07); color:var(--ink-4); font-size:26px; }
  .tab.on { background:var(--ink-6); color:var(--bg); font-weight:700; }
  .tab.focused { box-shadow:0 0 0 2px var(--bg), 0 0 0 6px var(--white); }
  /* ---------- views & scrolling wraps ---------- */
  .view { position:absolute; left:0; top:252px; width:1920px; height:828px; overflow:hidden; display:none; }
  .view.on { display:block; }
  .vwrap { position:absolute; left:0; width:1920px; }
  /* ---------- hero ---------- */
  .heroblk { position:relative; width:1920px; height:472px; overflow:hidden; margin-bottom:18px; background:var(--panel-2); }
  .heroBg { position:absolute; left:0; top:-140px; width:1920px; height:760px; object-fit:cover; opacity:.5; }
  .heroShade { position:absolute; left:0; top:0; width:1920px; height:472px;
               background:linear-gradient(90deg, var(--scrim-93) 30%, var(--scrim-45) 65%, var(--scrim-18)); }
  .heroContent { position:absolute; left:72px; bottom:52px; width:1180px; }
  .heroTitle { font-size:64px; font-weight:800; line-height:1.05; }
  .heroMeta { margin-top:14px; font-size:26px; color:var(--ink-5); }
  .mi { margin-right:28px; } .mi:last-child { margin-right:0; }
  .heroMeta .star { color:var(--gold); }
  .heroDesc { margin-top:12px; font-size:24px; line-height:1.45; color:var(--ink-2); width:1020px;
              max-height:72px; overflow:hidden; }
  .heroBtns { margin-top:24px; }
  .heroPoster { position:absolute; right:130px; top:52px; width:224px; height:323px; border-radius:16px;
                overflow:hidden; box-shadow:0 14px 30px var(--k55); background:var(--panel); }
  .heroPoster img { width:224px; height:323px; object-fit:cover; }
  .skelhero { width:1920px; height:472px; background:linear-gradient(100deg, var(--skel-1) 40%, var(--skel-2) 50%, var(--skel-1) 60%); background-size:200% 100%; animation:sksweep 1.15s linear infinite; }
  /* ---------- rows & cards ---------- */
  .rowblk { margin:0 0 26px 0; }
  .rowlabel { margin:0 0 12px 72px; font-size:29px; font-weight:600; color:var(--ink-7); }
  .rowlabel .dim { color:var(--dim); font-weight:400; font-size:24px; }
  .strip { position:relative; height:382px; overflow:hidden; }
  .stripInner { position:absolute; left:0; top:0; height:382px; white-space:nowrap; padding-left:72px;
                padding-top:12px; }
  .stripInner.noindent { padding-left:2px; }
  .card { display:inline-block; vertical-align:top; width:208px; margin-right:22px; }
  .poster { position:relative; width:208px; height:300px; border-radius:14px; overflow:hidden;
            background:var(--panel); }
  .poster img { width:208px; height:300px; object-fit:cover; display:block; }
  .poster .noposter { padding:26px 16px; font-size:23px; color:var(--ink-2); white-space:normal; line-height:1.35; }
  .rankno { position:absolute; left:4px; bottom:-12px; z-index:3; font-size:96px; font-weight:800; line-height:1; color:var(--pill-88); -webkit-text-stroke:3px var(--ink-8); }
  .eplabel { position:absolute; left:0; right:0; bottom:0; z-index:3; padding:30px 10px 8px; background:linear-gradient(var(--clear), var(--k88)); color:var(--white); font-size:19px; font-weight:600; line-height:1.3; }
  .eplabel .et { display:block; font-weight:400; font-size:17px; color:var(--ink-9); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .eplabel .prem { color:var(--gold); }
  .card.focused .poster { box-shadow:0 0 0 3px var(--bg), 0 0 0 7px var(--white); z-index:3; }
  .score { position:absolute; right:8px; top:8px; background:var(--shade-82); color:var(--gold);
           font-size:20px; padding:3px 9px; border-radius:9px; }
  .badges { position:absolute; left:8px; bottom:8px; }
  .bdg { display:inline-block; min-width:34px; text-align:center; padding:3px 7px; margin-right:6px;
         border-radius:8px; font-size:19px; font-weight:700; color:var(--white); }
  .bdg.nfx { background:var(--nfx); } .bdg.dnp { background:var(--dnp); } .bdg.amp { background:var(--amp); }
  .ctitle { margin-top:9px; font-size:21px; color:var(--ink-10); white-space:nowrap; overflow:hidden;
            text-overflow:ellipsis; width:208px; }
  .cyear { font-size:19px; color:var(--ink-11); }
  .skel { display:inline-block; width:208px; height:300px; border-radius:14px;
          background:linear-gradient(100deg, var(--skel-3) 40%, var(--skel-4) 50%, var(--skel-3) 60%); background-size:200% 100%;
          margin-right:22px; animation:sksweep 1.15s linear infinite; }
  @keyframes sksweep { from { background-position:120% 0; } to { background-position:-80% 0; } }
  @keyframes skpulse { from { opacity:.45; } to { opacity:1; } }
  .card.sm { width:132px; margin-right:18px; }
  .card.sm .poster { width:132px; height:190px; border-radius:10px; }
  .card.sm .poster img { width:132px; height:190px; }
  .card.sm .score { font-size:16px; padding:2px 6px; }
  .card.sm .bdg { min-width:26px; font-size:15px; padding:2px 5px; }
  .newep { position:absolute; top:8px; left:8px; z-index:2; background:var(--gold); color:var(--badge-ink);
    font-size:14px; font-weight:800; padding:3px 8px; border-radius:6px; }
  /* ---------- filter bars & chips ---------- */
  .secbar { position:absolute; left:0; top:0; width:1920px; height:76px; }
  .fbar { margin:8px 0 0 72px; }
  .fbar.noindent { margin-left:0; }
  .chip { display:inline-block; padding:11px 22px; margin-right:14px; border-radius:28px;
          background:var(--w07); color:var(--ink-4); font-size:23px; }
  .chip b { color:var(--gold); font-weight:700; }
  .chip.focused { box-shadow:0 0 0 2px var(--bg), 0 0 0 6px var(--white); background:var(--w15); }
  .chip.reset b { color:var(--accent-warm); }
  /* ---------- dropdown ---------- */
  #ddmenu { position:absolute; min-width:308px; background:var(--panel-3); border:2px solid var(--w20);
            border-radius:14px; padding:8px; z-index:80; display:none; box-shadow:0 26px 64px var(--k65); }
  #ddmenu.on { display:block; }
  .dditem { padding:12px 18px; font-size:25px; border-radius:9px; color:var(--ink-4); white-space:nowrap; }
  .dditem .ddcheck { float:right; color:var(--gold); margin-left:26px; }
  .dditem.focused { background:var(--w15); color:var(--white); font-weight:700; }
  .dditem.focused .ddcheck { color:var(--gold); }
  /* ---------- search (two-column) ---------- */
  #sLeft { position:absolute; left:72px; top:6px; width:630px; }
  #qbox { font-size:32px; margin-bottom:22px; }
  #qbox .q { color:var(--gold); font-weight:700; }
  #qbox .hint { display:block; color:var(--dim); font-size:22px; margin-top:8px; }
  .key { display:inline-block; width:52px; height:56px; line-height:56px; text-align:center; margin:0 8px 10px 0;
         border-radius:11px; background:var(--w08); font-size:22px; }
  .key.wide { width:112px; font-size:20px; }
  .key.focused { box-shadow:0 0 0 2px var(--bg), 0 0 0 6px var(--white); background:var(--w16); }
  #sRightBar { position:absolute; left:760px; top:0; width:1160px; height:76px; }
  #sresultsWrap { left:760px; top:84px; width:1160px; }
  #sresultsWrap .rowlabel { margin-left:2px; }
  /* ---------- sections (movies / series) ---------- */
  .secwrap { top:84px; }
  /* ---------- buttons ---------- */
  .dbtn.loadmore { border:2px solid var(--gold-65); color:var(--gold); background:var(--gold-08);
                   font-weight:700; padding:20px 46px; font-size:25px; }
  .dbtn.loadmore.focused { background:var(--w15); }
  /* sports */
  #view-sports .strip { height:310px; }
  #view-sports .stripInner { height:310px; }
  .gcard { display:inline-block; vertical-align:top; width:700px; height:252px; margin-right:28px; border-radius:18px;
           background:var(--card); border:1px solid var(--line); padding:24px 28px 18px 36px; position:relative; overflow:hidden; }
  .gedge { position:absolute; left:0; top:0; bottom:0; width:7px; }
  .gedge i { display:block; height:50%; }
  .gcard.focused { box-shadow:0 0 0 3px var(--bg), 0 0 0 7px var(--white); }
  .gcard.dim { opacity:.52; }
  .gcard.rz { background:var(--rz-bg); border-color:var(--rz-line); }
  .gc-top { display:flex; justify-content:space-between; align-items:center; }
  .gleague { font-size:21px; font-weight:600; color:var(--dim); }
  .gnet { font-size:23px; font-weight:700; color:var(--ink-12); }
  .gnet.ant { color:var(--gold); }
  .gnet.none { color:var(--dim); font-weight:600; }
  .gteams { margin-top:12px; }
  .gtrow { display:flex; align-items:center; gap:18px; margin-top:7px; }
  .glogo { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
           font-size:17px; font-weight:800; color:var(--ink-4); flex:none; position:relative;
           background:var(--w07); border:1px solid var(--w10); }
  .glogo img { position:absolute; left:50%; top:50%; width:42px; height:42px; transform:translate(-50%,-50%); object-fit:contain; }
  .gname { font-size:30px; font-weight:600; color:var(--ink); flex:1; white-space:nowrap; overflow:hidden; }
  .gtrow.win .gname { color:var(--ink); font-weight:800; }
  .gscore { font-size:40px; font-weight:800; color:var(--ink-14); min-width:64px; text-align:right; }
  .gtrow.win .gscore { color:var(--ink); }
  .gtrow.lose .gname, .gtrow.lose .gscore { color:var(--ink-50); }
  .grec { font-size:23px; color:var(--dim-2); font-weight:600; }
  .gc-bot { position:absolute; left:30px; right:28px; bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .gstat { font-size:26px; font-weight:800; color:var(--live); }
  @media (prefers-reduced-motion: reduce) { .skelhero, .skelcard { animation:none; } }
  .gstat.soon { color:var(--ink-2); }
  .rz-title { font-size:38px; font-weight:800; margin-top:8px; }
  .rz-title span { color:var(--rz-red); }
  .sportsmsg { margin:30px 0 0 72px; font-size:27px; color:var(--ink-2); }
  .dbtn { display:inline-block; padding:18px 34px; margin-right:18px; border-radius:14px;
          background:var(--w10); font-size:27px; color:var(--text); }
  .dbtn.nfx { background:var(--nfx); } .dbtn.dnp { background:var(--dnp); } .dbtn.amp { background:var(--amp); }
  .dbtn.focused { box-shadow:0 0 0 3px var(--bg), 0 0 0 8px var(--white); }
  /* ---------- overlays ---------- */
  .plate { position:absolute; left:0; top:0; width:1920px; height:1080px; z-index:40; display:none;
           background:var(--scrim-96); }
  .plate.on { display:block; }
  #dBg { position:absolute; left:-40px; top:-40px; width:2000px; height:1160px; object-fit:cover;
         filter:blur(22px) brightness(.42); opacity:.85; }
  #dPoster { position:absolute; left:110px; top:120px; width:380px; height:548px; border-radius:18px;
             overflow:hidden; background:var(--panel); }
  #dPoster img { width:380px; height:548px; object-fit:cover; }
  #dPoster .noposter { padding:36px 24px; font-size:30px; color:var(--ink-2); line-height:1.4; }
  #dMain { position:absolute; left:560px; top:120px; width:1240px; }
  #dTitle { font-size:56px; font-weight:700; line-height:1.12; }
  #dMeta { margin-top:14px; font-size:27px; color:var(--ink-2); }
  #dMeta .star { color:var(--gold); }
  #dDesc { margin-top:22px; font-size:26px; line-height:1.5; color:var(--ink-15); width:1150px;
           max-height:210px; overflow:hidden; }
  #dAvail { margin-top:24px; font-size:24px; color:var(--ink-3); width:1150px; line-height:1.45; }
  #dBtns { position:absolute; left:560px; top:778px; }
  #dSimilar { position:absolute; left:110px; top:856px; width:1700px; }
  #dSimLabel { font-size:24px; color:var(--ink-3); margin-bottom:10px; }
  #dSimLabel b { color:var(--white); }
  #dSimStrip { position:relative; height:204px; overflow:hidden; }
  #dSimStrip .stripInner { height:204px; padding-left:2px; padding-top:4px; }
  #pWrap { position:absolute; left:0; top:0; width:1920px; height:1080px; text-align:center; }
  #pLabel { margin-top:110px; font-size:34px; color:var(--ink-3); }
  #pPoster { margin:36px auto 0 auto; width:340px; height:490px; border-radius:18px; overflow:hidden;
             background:var(--panel); }
  #pPoster img { width:340px; height:490px; object-fit:cover; }
  #pTitle { margin-top:30px; font-size:48px; font-weight:700; }
  #pMeta { margin-top:10px; font-size:26px; color:var(--ink-2); }
  #pBtns { margin-top:44px; }
  #status { position:absolute; left:56px; bottom:20px; font-size:22px; color:var(--ink-16); z-index:6;
            background:var(--scrim-88); padding:7px 16px; border-radius:12px; }
  /* v2.5 polish: shared focus motion + ranked-card badges */
  .tab, .chip, .key, .rchip, .dbtn, .poster { transition:none; }
  .badges.right { left:auto; right:8px; }
  .empty { margin:30px 0 0 72px; font-size:27px; color:var(--ink-3); }
  .empty.noindent { margin-left:2px; }
  /* ---------- v2.1: seen, cast, recent searches ---------- */
  .seenbdg { position:absolute; left:8px; top:8px; background:var(--seen-88); color:var(--white);
             font-size:18px; font-weight:700; padding:3px 9px; border-radius:8px; }
  #dCast { margin-top:20px; }
  .castItem { display:inline-block; vertical-align:top; width:104px; margin-right:14px; }
  .castItem img, .castItem .cph { width:92px; height:124px; border-radius:10px; object-fit:cover; background:var(--panel); }
  .castItem .cph { text-align:center; line-height:124px; font-size:34px; color:var(--dim-3); }
  .castItem .cn { font-size:17px; color:var(--ink-17); margin-top:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100px; }
  .castItem .cc { font-size:16px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100px; }
  .rchip { display:inline-block; padding:13px 24px; margin:0 12px 12px 0; border-radius:26px;
           background:var(--w08); font-size:23px; color:var(--ink-4); }
  .rchip.focused { box-shadow:0 0 0 2px var(--bg), 0 0 0 6px var(--white); }
  /* ---------- trailer player ---------- */
  #plate-trailer { z-index:60; }
  #tFrameWrap { position:absolute; left:160px; top:64px; width:1600px; height:900px; background:var(--black);
                border-radius:12px; overflow:hidden; }
  #tFrameWrap iframe, #tFrameWrap > div { width:1600px; height:900px; }
  #tBtns { position:absolute; left:0; top:984px; width:1920px; text-align:center; }
  #tMsg { position:absolute; left:0; top:984px; width:1920px; text-align:center; font-size:25px; color:var(--ink-3); }
</style>
</head>
<body>
<div id="bg"></div>
<div id="hdr">
  <div id="greet">Stream Guide</div>
  <div id="subline"></div>
  <div id="clockbox"><div id="clock">--:--</div><div id="wx">Diamond Bar</div></div>
</div>
<div id="tabs"></div>

<div class="view" id="view-home"><div class="vwrap" id="rowsWrap"></div></div>

<div class="view" id="view-movies">
  <div class="secbar" id="fmovies"></div>
  <div class="vwrap secwrap" id="mwrap"></div>
</div>

<div class="view" id="view-series">
  <div class="secbar" id="fseries"></div>
  <div class="vwrap secwrap" id="swrap"></div>
</div>

<div class="view" id="view-sports"><div class="vwrap" id="sportsWrap"></div></div>

<div class="view" id="view-search">
  <div id="sLeft">
    <div id="qbox">Search: <span class="q" id="qtext"></span></div>
    <div id="keys"></div>
  </div>
  <div id="sRightBar"><div id="sfilterbar"></div></div>
  <div class="vwrap" id="sresultsWrap"><div id="sresults"></div></div>
</div>

<div class="view" id="view-maybe"><div class="vwrap" id="maybeWrap"></div></div>

<div class="view" id="view-trakt"><div class="vwrap" id="traktWrap"></div></div>

<div class="plate" id="plate-detail">
  <img id="dBg" alt=""/>
  <div id="dPoster"></div>
  <div id="dMain">
    <div id="dTitle"></div>
    <div id="dMeta"></div>
    <div id="dDesc"></div>
    <div id="dAvail"></div>
    <div id="dCast"></div>
  </div>
  <div id="dBtns"></div>
  <div id="dSimilar">
    <div id="dSimLabel">More Like This</div>
    <div id="dSimStrip"><div class="stripInner" id="dSimInner"></div></div>
  </div>
</div>

<div class="plate" id="plate-pick">
  <div id="pWrap">
    <div id="pLabel">Tonight's pick</div>
    <div id="pPoster"></div>
    <div id="pTitle"></div>
    <div id="pMeta"></div>
    <div id="pBtns"></div>
  </div>
</div>

<div class="plate" id="plate-trailer">
  <div id="tFrameWrap"></div>
  <div id="tMsg"></div>
  <div id="tBtns" style="display:none">
    <span class="dbtn" data-act="tyt">Open in YouTube</span>
    <span class="dbtn" data-act="tclose">Close</span>
  </div>
</div>

<div id="ddmenu"></div>
<div id="status">Loading the catalog…</div>
<script>
"use strict";
/* Stream Guide v2 — unified catalog across Sameer's services.
   Data: JustWatch GraphQL (keyless) + Open-Meteo weather. Playback hands off to the official apps. */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

var JW_URL = "https://apis.justwatch.com/graphql";

function activate(el) {

        var pick = null;

          if (!rz.year || Math.abs(yr - rz.year) <= 1) { pick = nodes[i]; break; }
        }

  else if (act === "redzone") { launchApp("UdGpKNSRmw.NFL", "NFL"); }
  else if (act === "launch" || act === "hwatch") { try { saveReturn(currentNode || heroNode); } catch (e) {} launchApp(el.getAttribute("data-app"), el.getAttribute("data-name")); }
  else if (act === "hdetails") openDetail(heroNode);

  else if (act === "maybe") { toggleMaybe(currentNode); openDetail(currentNode); }

  else if (act === "loadmore") { loadMore(screen); }
  else if (act === "tsync") { $("status").textContent = "Syncing with Trakt…"; traktSync(true).then(function () { if (screen === "trakt") { renderTrakt(); rebuildBands(true); } $("status").textContent = "Trakt sync complete."; }); }

document.addEventListener("keydown", function (ev) {

var SPORTS_LEAGUES = [
  { key: "nfl", name: "NFL", path: "football/nfl" },

function sportsYmd(d) { function p(n) { return (n < 10 ? "0" : "") + n; } return "" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()); }
function fmtGameTime(iso) {
  var d = new Date(iso); if (isNaN(d.getTime())) return "";
  var h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? "PM" : "AM"; h = h % 12; if (!h) h = 12;
  return h + ":" + (m < 10 ? "0" : "") + m + " " + ap + " PT";

function teamOf(c) {
  if (!c || !c.team) return { name: "TBD", abbr: "", logo: "", color: "33415e", score: "", record: "" };
  return { name: c.team.displayName || c.team.name || "TBD", abbr: c.team.abbreviation || "",
           logo: c.team.logo || "", color: c.team.color || "33415e",

function parseGame(ev, league) {

  cs.forEach(function (c) { if (c.homeAway === "home") home = c; else if (c.homeAway === "away") away = c; });
  if (!home) home = cs[0]; if (!away) away = cs[1];
  var st = ev.status || comp.status || {};

  if (!nets.length && comp.broadcast) nets.push(comp.broadcast);

var ANT_NETS = [ { n: "CBS", ch: 2 }, { n: "NBC", ch: 4 }, { n: "ABC", ch: 7 }, { n: "FOX", ch: 11 } ];
var SPORT_APPS = [
  { re: /^espn/i, appId: "XtU8fQk2gN.ESPN", name: "ESPN" },
  { re: /prime video/i, appId: "org.tizen.primevideo", name: "Prime Video" },
  { re: /^nfl/i, appId: "UdGpKNSRmw.NFL", name: "NFL" },
  { re: /disney/i, appId: "MCmYXNxgcu.DisneyPlus", name: "Disney+" }

function gameAction(g) {

      return { kind: "tune", ch: ANT_NETS[j].ch, chip: ANT_NETS[j].n + " " + ANT_NETS[j].ch, cls: "ant", act: "OK → tune to " + ANT_NETS[j].n };
  }

      return { kind: "app", appId: SPORT_APPS[j].appId, name: SPORT_APPS[j].name, chip: net, cls: "", act: "OK → " + SPORT_APPS[j].name + " app" };
  }

function teamRow(t, o, state) {
  var win = (state === "in" || state === "post") && t.score !== "" && o.score !== "" && Number(t.score) > Number(o.score);
  var lose = (state === "in" || state === "post") && t.score !== "" && o.score !== "" && Number(t.score) < Number(o.score);
  var right = (state === "in" || state === "post") ? '<span class="gscore">' + esc(t.score) + "</span>"

    '<span class="gname">' + esc(t.name) + "</span>" + right + "</div>";
}
function gameCard(g) {
  var a = gameAction(g);
  var live = g.state === "in";
  var stat = live ? (g.detail || "Live") : g.state === "post" ? (g.detail || "Final") : fmtGameTime(g.date);
  var attrs = ' data-act="game" data-kind="' + a.kind + '"' +

    (a.kind === "app" ? ' data-app="' + a.appId + '" data-name="' + esc(a.name) + '"' : "");

    '<div class="gc-top"><span class="gleague">' + g.league.name + '</span><span class="gnet ' + a.cls + '">' + esc(a.chip) + "</span></div>" +
    '<div class="gteams">' + teamRow(g.away, g.home, g.state) + teamRow(g.home, g.away, g.state) + "</div>" +

function redzoneCard(anyLive) {
  return '<div class="gcard rz" data-act="redzone"><span class="gedge"><i style="background:var(--rz-edge);height:100%"></i></span><div class="gc-top"><span class="gleague">NFL</span><span class="gnet">NFL APP</span></div>' +

function renderSports(results) {
  var byLeague = {};
  var stateRank = function (g) { return g.state === "in" ? 0 : g.state === "pre" ? 1 : 2; };
  var actRank = function (g) { var a = gameAction(g); return a.kind === "tune" ? 0 : a.kind === "app" ? 1 : 2; };
  results.forEach(function (r) {
    var games = [];
    (r.events || []).forEach(function (ev) { games.push(parseGame(ev, r.league)); });
    games = games.map(function (g, i) { return [g, i]; }).sort(function (a, b) {
      var d = stateRank(a[0]) - stateRank(b[0]);
      if (d) return d;
      if (a[0].state === "in") { var w = actRank(a[0]) - actRank(b[0]); if (w) return w; }
      if (a[0].date !== b[0].date) return a[0].date < b[0].date ? -1 : 1;
      return a[1] - b[1];
    }).map(function (p) { return p[0]; });
    byLeague[r.league.key] = games;
  });

  var now = new Date();
  var isSunday = now.getDay() === 0;
  var hourNow = now.getHours() + now.getMinutes() / 60;
  SPORTS_LEAGUES.forEach(function (l) {

    }

  });

function loadSports(isRefresh) {

  var ymd = sportsYmd(new Date());

    return fetch("https://site.api.espn.com/apis/site/v2/sports/" + l.path + "/scoreboard?dates=" + ymd)

/* Channel tuning — the launcher's proven chain (2026-10-20): setSource(TV),
 * default channel list (the "AIR" mode enum throws on this TV), object-form

function tuneToChannel(major) {
  var status = $("status");
  status.textContent = "Tuning to channel " + major + "\u2026";
  function openViewer() {
    try { tizen.application.launch("org.tizen.tv-viewer", function () {}, function () {
      try { tizen.application.launch("com.samsung.tv.coba.livetv", function () {}, function () { status.textContent = "Couldn't open Live TV."; }); }
      catch (e) { status.textContent = "Couldn't open Live TV."; }
    }); } catch (e) { status.textContent = "Couldn't open Live TV."; }
  }
  function tuned() { status.textContent = "Channel " + major; setTimeout(openViewer, 350); }
  function tryTune(ch) {
    try { tizen.tvchannel.tune(ch, { onsuccess: tuned, onerror: function () {
      try { tizen.tvchannel.tune(ch, tuned, function () { openViewer(); }, { type: "MAIN" }); } catch (e) { openViewer(); }
    } }); } catch (e) {
      try { tizen.tvchannel.tune(ch, tuned, function () { openViewer(); }, { type: "MAIN" }); } catch (e2) { openViewer(); }
    }

    try { tizen.tvchannel.getChannelList(function (list) {
      var ch = null;

      if (ch) tryTune(ch); else openViewer();
    }, function () { openViewer(); }); } catch (e) { openViewer(); }
  }
  if (!window.tizen || !tizen.tvchannel || !tizen.tvwindow) { openViewer(); return; }

    tizen.tvwindow.getSourceList(function (sources) {
      var tv = null;
      (sources || []).forEach(function (s) { if (!tv && s.type === "TV") tv = s; });
      if (!tv) { fetchList(); return; }
      try { tizen.tvwindow.setSource(tv, fetchList, fetchList); } catch (e) { fetchList(); }
    }, fetchList);
  } catch (e) { fetchList(); }
}
