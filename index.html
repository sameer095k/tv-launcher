<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sameer TV Launcher</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <img id="wallpaper" src="assets/wallpaper.jpg" alt="">
  <div id="scrim"></div>
  <header id="topbar">
    <div class="clockbox">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
    <div class="top-actions">
      <button class="top-btn focusable" data-view="allapps" type="button" title="All apps">&#x25A6;</button>
      <button class="top-btn focusable" data-view="settings" type="button" title="Settings">&#x2699;</button>
    </div>
  </header>
  <main id="main">
    <section id="view-apps" class="view active" aria-label="Home">
      <div id="home-list" class="homelist"></div>
    </section>
    <section id="view-livetv" class="view" aria-label="Live TV">
      <h1 class="view-title">Live TV <span class="subtitle">Antenna</span></h1>
      <div id="channel-grid" class="channels"></div>
      <p class="hint">Select a channel to tune the antenna</p>
      <button id="open-livetv" class="btn focusable" type="button">Open Samsung Live TV</button>
      <p id="tv-status" class="tvstatus"></p>
    </section>
    <section id="view-allapps" class="view" aria-label="All apps">
      <div class="plate">
        <h1 class="view-title">All apps</h1>
        <div id="appstore-list" class="appstore"></div>
      </div>
    </section>
    <section id="view-settings" class="view" aria-label="Settings">
      <div class="plate">
        <h1 class="view-title">Settings</h1>
        <div class="setrow">
          <button id="open-settings" class="btn focusable" type="button">&#x2699; TV Settings</button>
          <span class="infoline">Opens Samsung's own settings — picture, sound, network, broadcasting</span>
        </div>
        <p id="set-status" class="tvstatus"></p>
        <h2 class="section-title">Inputs</h2>
        <div id="inputs-row" class="inputs"></div>
        <h2 class="section-title">Sound</h2>
        <div class="setrow">
          <button id="vol-down" class="btn focusable" type="button">Volume &minus;</button>
          <span id="vol-level" class="vollevel">&mdash;</span>
          <button id="vol-up" class="btn focusable" type="button">Volume +</button>
          <button id="vol-mute" class="btn focusable" type="button">Mute</button>
        </div>
        <h2 class="section-title">About</h2>
        <p id="tv-info" class="infoline"></p>
        <p id="diag" class="infoline"></p>
        <p class="hint">&#x2713; No ads &middot; Sameer TV Launcher</p>
      </div>
    </section>
  </main>
  <div id="toast" role="status"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
